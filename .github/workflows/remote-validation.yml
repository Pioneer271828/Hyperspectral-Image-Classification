name: Authorized training-container validation
on:
  pull_request:
  push:
    branches:
      - main
      - codex/issue-167-development-integration
      - 'codex/repository-integration-*'
  workflow_dispatch:
    inputs:
      gpu:
        description: Run focused CUDA acceptance on the authorized container
        type: boolean
        default: false
      gpu_uuid:
        description: Physical NVIDIA GPU UUID for focused CUDA acceptance
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: hsi-validation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validation:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, hsi-training-container]
    # The recorded 1,125-test CPU suite took about 49 minutes on this container.
    timeout-minutes: 120
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      HSI_PYTHON: ${{ vars.HSI_VALIDATION_PYTHON || '/home/lbx/hsi-pioneer271828/envs/hsi/bin/python' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check current status and repair inclusion
        run: '"$HSI_PYTHON" scripts/check_repository.py --expected-commit "$(git rev-parse HEAD)"'
      - name: Integrated CPU regression
        env:
          CUDA_VISIBLE_DEVICES: ''
        run: '"$HSI_PYTHON" -m unittest discover -s tests -v'
      - name: Focused GPU regression
        if: github.event_name == 'workflow_dispatch' && inputs.gpu
        env:
          CUDA_VISIBLE_DEVICES: ${{ inputs.gpu_uuid }}
          HSI_GPU_LEASE_ROOT: /home/lbx/hsi-pioneer271828/runs/.p4_gpu_leases
        run: |
          set -euo pipefail
          gpu="$CUDA_VISIBLE_DEVICES"
          [[ "$gpu" =~ ^GPU-[0-9a-f]{8}(-[0-9a-f]{4}){3}-[0-9a-f]{12}$ ]]
          [[ "$(realpath -e "$HSI_GPU_LEASE_ROOT")" == "$HSI_GPU_LEASE_ROOT" ]]
          lease="$HSI_GPU_LEASE_ROOT/$gpu.lock"
          [[ -f "$lease" && ! -L "$lease" ]]
          exec 9<"$lease"
          flock -xn 9
          snapshot=$(nvidia-smi -i "$gpu" --query-gpu=uuid,memory.free,utilization.gpu --format=csv,noheader,nounits)
          IFS=', ' read -r actual free util <<< "$snapshot"
          [[ "$actual" == "$gpu" && "$free" =~ ^[0-9]+$ && "$util" =~ ^[0-9]+$ ]]
          if (( free < 12288 || util > 60 )); then
            printf 'GPU %s is unavailable: %s MiB free, %s%% used\n' "$gpu" "$free" "$util" >&2
            exit 1
          fi
          MON2_DEVICE=cuda "$HSI_PYTHON" -m unittest discover -s tests -p test_monitoring_updates.py -v
          MON3B_DEVICE=cuda "$HSI_PYTHON" -m unittest discover -s tests -p test_monitoring_interventions.py -v
          REPAIR_DEVICE=cuda "$HSI_PYTHON" -m unittest discover -s tests -p test_vca_release_compatibility.py -v
      - name: Verify tracked checkout remains clean
        if: always()
        run: test -z "$(git status --porcelain --untracked-files=all)"
